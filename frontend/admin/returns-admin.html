<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Return Management | Admin | Caravan of Flavours</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../assets/css/styles.css">
    <script src="../assets/js/custom-ui.js?v=1.8"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>tailwind.config = { theme: { extend: { colors: { primary: '#FF7E21' } } } }</script>
    <style>
        body {
            font-family: 'Outfit', sans-serif;
            background: #fafaf9;
            color: #1c1917;
        }

        @keyframes spin {
            from {
                transform: rotate(0deg)
            }

            to {
                transform: rotate(360deg)
            }
        }

        .spin {
            animation: spin 1s linear infinite;
        }

        .stat-card {
            background: white;
            border: 1px solid #e7e5e4;
            border-radius: 20px;
            padding: 24px;
        }
    </style>
</head>

<body>

    <aside
        style="width:220px;background:white;border-right:1px solid #e7e5e4;position:fixed;height:100vh;padding:24px;z-index:50;overflow-y:auto;">
        <div style="margin-bottom:40px;display:flex;align-items:center;gap:14px;">
            <img src="../assets/images/logo.png" alt="Logo" style="height:42px;width:auto;object-fit:contain;">
            <div>
                <h3 style="font-size:18px;color:#1c1917;font-weight:700;line-height:1.1;">Caravan</h3>
                <small
                    style="font-size:10px;color:#a8a29e;letter-spacing:0.1em;font-weight:700;text-transform:uppercase;">Admin
                    Panel</small>
            </div>
        </div>
        <nav style="display:flex;flex-direction:column;gap:4px;">
            <a href="admin-dashboard.html"
                style="display:flex;align-items:center;gap:10px;padding:10px 14px;border-radius:8px;text-decoration:none;color:#1c1917;font-weight:500;font-size:14px;"
                onmouseover="this.style.background='#fafaf9'" onmouseout="this.style.background='transparent'"><img
                    src="https://api.iconify.design/lucide:layout-dashboard.svg?color=%231c1917" width="18">
                Dashboard</a>
            <a href="returns-admin.html"
                style="display:flex;align-items:center;gap:10px;padding:10px 14px;border-radius:8px;text-decoration:none;color:white;background:#FF7E21;font-weight:700;font-size:14px;"><img
                    src="https://api.iconify.design/lucide:rotate-ccw.svg?color=white" width="18"> Return Requests</a>
        </nav>
        <div style="position:absolute;bottom:24px;left:24px;right:24px;">
            <button onclick="logout()"
                style="display:flex;align-items:center;justify-content:center;gap:12px;padding:12px 16px;border-radius:8px;color:#ff0000;background:transparent;border:2px solid #ff0000;width:100%;cursor:pointer;font-weight:700;font-size:14px;">
                <img src="https://api.iconify.design/lucide:log-out.svg?color=%23ff0000" width="18"
                    style="transform:rotate(180deg);"> Sign Out
            </button>
        </div>
        <script>
            async function logout() {
                await fetch('../../backend/api/auth/logout.php');
                window.location.href = '../auth/login.html';
            }
        </script>
    </aside>

    <main style="margin-left:220px;padding:32px 40px;">
        <header style="margin-bottom:32px;display:flex;justify-content:space-between;align-items:center;">
            <div>
                <h1 style="font-size:32px;font-weight:800;color:#1c1917;letter-spacing:-0.02em;">Return Requests</h1>
                <p style="font-size:15px;color:#78716c;margin-top:4px;">Review and process customer return & refund
                    requests.</p>
            </div>
        </header>

        <!-- Stats -->
        <div style="display:grid;grid-template-columns:repeat(5,1fr);gap:16px;margin-bottom:32px;" id="stats-row">
            <div class="stat-card">
                <p style="font-size:11px;font-weight:700;color:#a8a29e;text-transform:uppercase;letter-spacing:.05em;">
                    Total</p>
                <p id="stat-total" style="font-size:28px;font-weight:800;color:#1c1917;">-</p>
            </div>
            <div class="stat-card">
                <p style="font-size:11px;font-weight:700;color:#d97706;text-transform:uppercase;">Requested</p>
                <p id="stat-requested" style="font-size:28px;font-weight:800;color:#d97706;">-</p>
            </div>
            <div class="stat-card">
                <p style="font-size:11px;font-weight:700;color:#059669;text-transform:uppercase;">Approved</p>
                <p id="stat-approved" style="font-size:28px;font-weight:800;color:#059669;">-</p>
            </div>
            <div class="stat-card">
                <p style="font-size:11px;font-weight:700;color:#7c3aed;text-transform:uppercase;">Refunded</p>
                <p id="stat-refund_completed" style="font-size:28px;font-weight:800;color:#7c3aed;">-</p>
            </div>
            <div class="stat-card">
                <p style="font-size:11px;font-weight:700;color:#dc2626;text-transform:uppercase;">Rejected</p>
                <p id="stat-rejected" style="font-size:28px;font-weight:800;color:#dc2626;">-</p>
            </div>
        </div>

        <!-- Filter Tabs -->
        <div style="display:flex;gap:10px;margin-bottom:24px;overflow-x:auto;">
            <button onclick="loadReturns('all')" id="tab-all"
                style="padding:8px 20px;border-radius:20px;border:none;background:#1c1917;color:white;font-weight:700;font-size:13px;cursor:pointer;">All</button>
            <button onclick="loadReturns('requested')" id="tab-requested"
                style="padding:8px 20px;border-radius:20px;border:1px solid #e7e5e4;background:white;color:#78716c;font-weight:600;font-size:13px;cursor:pointer;">Requested</button>
            <button onclick="loadReturns('under_review')" id="tab-under_review"
                style="padding:8px 20px;border-radius:20px;border:1px solid #e7e5e4;background:white;color:#78716c;font-weight:600;font-size:13px;cursor:pointer;">Under
                Review</button>
            <button onclick="loadReturns('approved')" id="tab-approved"
                style="padding:8px 20px;border-radius:20px;border:1px solid #e7e5e4;background:white;color:#78716c;font-weight:600;font-size:13px;cursor:pointer;">Approved</button>
            <button onclick="loadReturns('refund_processing')" id="tab-refund_processing"
                style="padding:8px 20px;border-radius:20px;border:1px solid #e7e5e4;background:white;color:#78716c;font-weight:600;font-size:13px;cursor:pointer;">Processing</button>
            <button onclick="loadReturns('refund_completed')" id="tab-refund_completed"
                style="padding:8px 20px;border-radius:20px;border:1px solid #e7e5e4;background:white;color:#78716c;font-weight:600;font-size:13px;cursor:pointer;">Refunded</button>
            <button onclick="loadReturns('rejected')" id="tab-rejected"
                style="padding:8px 20px;border-radius:20px;border:1px solid #e7e5e4;background:white;color:#78716c;font-weight:600;font-size:13px;cursor:pointer;">Rejected</button>
        </div>

        <div id="returns-list"></div>
    </main>

    <!-- Review Modal -->
    <div id="reviewModal"
        style="display:none;position:fixed;inset:0;background:rgba(0,0,0,0.6);backdrop-filter:blur(4px);z-index:200;display:none;align-items:center;justify-content:center;padding:24px;">
        <div
            style="background:white;border-radius:32px;padding:40px;width:100%;max-width:520px;position:relative;max-height:90vh;overflow-y:auto;">
            <button onclick="closeModal()"
                style="position:absolute;top:20px;right:20px;background:transparent;border:none;cursor:pointer;font-size:20px;color:#a8a29e;">✕</button>
            <h2 style="font-size:24px;font-weight:800;color:#1c1917;margin-bottom:4px;" id="modal-title">Review Return
            </h2>
            <p id="modal-subtitle" style="font-size:13px;color:#78716c;margin-bottom:24px;"></p>

            <!-- Return details recap -->
            <div id="modal-details"
                style="background:#fafaf9;border-radius:16px;padding:16px;margin-bottom:20px;font-size:13px;color:#78716c;">
            </div>

            <!-- New status -->
            <div style="margin-bottom:16px;">
                <label
                    style="font-size:11px;font-weight:700;color:#78716c;text-transform:uppercase;letter-spacing:.05em;display:block;margin-bottom:8px;">Update
                    Status</label>
                <select id="modal-status"
                    style="width:100%;border:1.5px solid #e7e5e4;border-radius:12px;padding:12px 14px;font-size:14px;font-weight:600;font-family:'Outfit',sans-serif;outline:none;">
                    <option value="under_review">🔍 Under Review</option>
                    <option value="approved">✅ Approved</option>
                    <option value="rejected">❌ Rejected</option>
                    <option value="refund_processing">💜 Refund Processing</option>
                    <option value="refund_completed">💚 Refund Completed (Credits Wallet)</option>
                </select>
            </div>

            <!-- Admin notes -->
            <div style="margin-bottom:20px;">
                <label
                    style="font-size:11px;font-weight:700;color:#78716c;text-transform:uppercase;letter-spacing:.05em;display:block;margin-bottom:8px;">Admin
                    Notes <span style="color:#d1d5db;">(optional)</span></label>
                <textarea id="modal-notes" rows="3"
                    placeholder="Add notes visible to customer (required if rejecting)..."
                    style="width:100%;border:1.5px solid #e7e5e4;border-radius:12px;padding:12px 14px;font-size:14px;font-weight:600;font-family:'Outfit',sans-serif;outline:none;resize:none;box-sizing:border-box;"></textarea>
            </div>

            <button onclick="submitReview()" id="modal-submit-btn"
                style="width:100%;padding:16px;background:#1c1917;color:white;border:none;border-radius:16px;font-size:15px;font-weight:700;cursor:pointer;font-family:'Outfit',sans-serif;">
                Update Return Status
            </button>
        </div>
    </div>

    <script>
        const STATUS_CONFIG = {
            requested: { label: 'Requested', bg: '#fef3c7', color: '#92400e' },
            under_review: { label: 'Under Review', bg: '#dbeafe', color: '#1e40af' },
            approved: { label: 'Approved', bg: '#d1fae5', color: '#065f46' },
            rejected: { label: 'Rejected', bg: '#fee2e2', color: '#991b1b' },
            refund_processing: { label: 'Refund Processing', bg: '#ede9fe', color: '#5b21b6' },
            refund_completed: { label: 'Refund Completed', bg: '#d1fae5', color: '#065f46' },
        };

        const REASON_LABELS = {
            damaged: '📦 Product Damaged',
            wrong_item: '🔄 Wrong Item',
            expired: '⏰ Expired Product',
            quality_issue: '⚠️ Quality Issue',
            other: '💬 Other',
        };

        let currentReturnId = null;

        function showToast(msg, type = 'success') {
            const t = document.createElement('div');
            t.style.cssText = `position:fixed;top:24px;left:50%;transform:translateX(-50%);z-index:9999;background:${type === 'error' ? '#fee2e2' : '#d1fae5'};color:${type === 'error' ? '#991b1b' : '#065f46'};padding:14px 24px;border-radius:12px;font-weight:700;font-size:14px;box-shadow:0 8px 24px rgba(0,0,0,0.1);`;
            t.innerText = (type === 'error' ? '❌ ' : '✅ ') + msg;
            document.body.appendChild(t);
            setTimeout(() => t.remove(), 3500);
        }

        async function loadReturns(status = 'all') {
            document.querySelectorAll('[id^="tab-"]').forEach(btn => {
                const active = btn.id === 'tab-' + status;
                btn.style.background = active ? '#1c1917' : 'white';
                btn.style.color = active ? 'white' : '#78716c';
            });

            const container = document.getElementById('returns-list');
            container.innerHTML = '<div style="text-align:center;padding:60px;"><img src="https://api.iconify.design/lucide:loader-2.svg" class="spin" style="width:32px;height:32px;margin:0 auto;display:block;"></div>';

            try {
                const url = '../../backend/api/returns/get-all-returns.php' + (status !== 'all' ? '?status=' + status : '');
                const res = await fetch(url);
                const data = await res.json();

                if (!data.success) { container.innerHTML = `<div style="text-align:center;padding:80px;color:#ef4444;font-weight:700;">Failed to load.</div>`; return; }

                // Update stats
                const s = data.summary || {};
                ['total', 'requested', 'approved', 'refund_completed', 'rejected'].forEach(k => {
                    const el = document.getElementById('stat-' + k);
                    if (el) el.innerText = s[k] || 0;
                });

                const returns = data.returns || [];
                if (returns.length === 0) {
                    container.innerHTML = `<div style="text-align:center;padding:80px;background:white;border-radius:24px;border:1px solid #e7e5e4;">
                    <div style="font-size:48px;margin-bottom:12px;">🔄</div>
                    <h3 style="font-size:18px;font-weight:700;color:#1c1917;margin-bottom:6px;">No return requests</h3>
                    <p style="color:#a8a29e;font-size:13px;">No returns match this filter.</p>
                </div>`;
                    return;
                }

                container.innerHTML = returns.map(r => {
                    const sc = STATUS_CONFIG[r.status] || STATUS_CONFIG['requested'];
                    const date = new Date(r.created_at).toLocaleDateString('en-IN', { day: 'numeric', month: 'short', year: 'numeric' });
                    const amount = parseFloat(r.refund_amount || 0);
                    const rJson = encodeURIComponent(JSON.stringify(r));
                    return `
                <div style="background:white;border:1px solid #e7e5e4;border-radius:24px;padding:24px;margin-bottom:16px;">
                    <div style="display:flex;align-items:flex-start;gap:16px;">
                        <div style="width:60px;height:60px;border-radius:14px;background:#f5f5f4;overflow:hidden;flex-shrink:0;">
                            <img src="${r.image_url ? '../../' + r.image_url : 'https://images.unsplash.com/photo-1596040033229?auto=format&fit=crop&w=200'}" style="width:100%;height:100%;object-fit:cover;" onerror="this.src='https://images.unsplash.com/photo-1596040033229?auto=format&fit=crop&w=200'">
                        </div>
                        <div style="flex:1;">
                            <div style="display:flex;align-items:center;gap:8px;margin-bottom:6px;flex-wrap:wrap;">
                                <span style="background:${sc.bg};color:${sc.color};padding:3px 10px;border-radius:20px;font-size:10px;font-weight:700;text-transform:uppercase;">${sc.label}</span>
                                <span style="font-size:11px;color:#a8a29e;font-weight:600;">#RET-${r.id.toString().padStart(5, '0')}</span>
                                <span style="font-size:11px;color:#a8a29e;">·</span>
                                <span style="font-size:11px;color:#a8a29e;">ORD-${r.order_id.toString().padStart(5, '0')}</span>
                                <span style="font-size:11px;color:#a8a29e;">· ${date}</span>
                            </div>
                            <h3 style="font-size:16px;font-weight:700;color:#1c1917;margin-bottom:2px;">${r.product_name}</h3>
                            <div style="font-size:12px;color:#78716c;font-weight:600;display:flex;gap:12px;flex-wrap:wrap;margin-bottom:6px;">
                                <span>👤 ${r.customer_name}</span>
                                <span>🌾 ${r.farmer_name}</span>
                                <span>${REASON_LABELS[r.reason] || r.reason}</span>
                                <span>💰 ₹${amount.toFixed(2)} via ${r.refund_method === 'wallet' ? 'Wallet' : 'Original'}</span>
                            </div>
                            ${r.description ? `<p style="font-size:12px;color:#78716c;background:#f5f5f4;border-radius:8px;padding:8px 12px;margin-bottom:6px;">${r.description}</p>` : ''}
                            ${r.admin_notes ? `<p style="font-size:12px;color:#1e40af;background:#dbeafe;border-radius:8px;padding:8px 12px;margin-bottom:6px;">💬 Notes: ${r.admin_notes}</p>` : ''}
                            ${r.image_path ? `<a href="../../${r.image_path}" target="_blank" style="font-size:11px;color:#FF7E21;font-weight:700;text-decoration:none;">📷 View Proof Image</a>` : ''}
                        </div>
                        <div style="flex-shrink:0;">
                            <button onclick='openModal(${r.id}, decodeURIComponent("${rJson}"))' style="padding:10px 20px;background:#FF7E21;color:white;border:none;border-radius:12px;font-weight:700;font-size:13px;cursor:pointer;">
                                Review
                            </button>
                        </div>
                    </div>
                </div>`;
                }).join('');
            } catch (e) {
                console.error(e);
                document.getElementById('returns-list').innerHTML = `<div style="text-align:center;padding:80px;color:#ef4444;font-weight:700;">Connection error.</div>`;
            }
        }

        function openModal(id, returnJson) {
            currentReturnId = id;
            const r = JSON.parse(returnJson);
            document.getElementById('modal-title').innerText = 'Review #RET-' + String(id).padStart(5, '0');
            document.getElementById('modal-subtitle').innerText = r.product_name + ' · ' + r.customer_name;
            document.getElementById('modal-details').innerHTML = `
            <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;">
                <div><strong>Reason:</strong> ${REASON_LABELS[r.reason] || r.reason}</div>
                <div><strong>Refund:</strong> ₹${parseFloat(r.refund_amount || 0).toFixed(2)}</div>
                <div><strong>Method:</strong> ${r.refund_method === 'wallet' ? '💰 Wallet' : '💳 Original'}</div>
                <div><strong>Current:</strong> ${STATUS_CONFIG[r.status]?.label || r.status}</div>
            </div>
            ${r.description ? `<div style="margin-top:8px;padding-top:8px;border-top:1px solid #e7e5e4;"><strong>Customer says:</strong> ${r.description}</div>` : ''}
        `;
            document.getElementById('modal-status').value = r.status;
            document.getElementById('modal-notes').value = r.admin_notes || '';
            const modal = document.getElementById('reviewModal');
            modal.style.display = 'flex';
        }

        function closeModal() {
            document.getElementById('reviewModal').style.display = 'none';
        }

        async function submitReview() {
            const newStatus = document.getElementById('modal-status').value;
            const notes = document.getElementById('modal-notes').value.trim();
            if (newStatus === 'rejected' && !notes) {
                showToast('Please provide a rejection reason in Admin Notes.', 'error'); return;
            }

            const btn = document.getElementById('modal-submit-btn');
            btn.disabled = true; btn.innerText = '⏳ Updating...';

            try {
                const res = await fetch('../../backend/api/returns/update-return-status.php', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ return_id: currentReturnId, status: newStatus, admin_notes: notes })
                });
                const data = await res.json();
                if (data.success) {
                    showToast(data.message, 'success');
                    closeModal();
                    loadReturns('all');
                } else {
                    showToast(data.message || 'Failed to update.', 'error');
                }
            } catch (e) {
                showToast('Connection error.', 'error');
            } finally {
                btn.disabled = false; btn.innerText = 'Update Return Status';
            }
        }

        window.onload = () => loadReturns('all');
    </script>
</body>

</html>
